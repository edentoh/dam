[system]
project_name = "DAM_Gate_Classifier"
seed = 1337
device = "cuda"
run_name = "is_dam_v1"
runs_dir = "runs"

[model]
# We use the same builder, but override num_classes to 1 in the script
backbone = "convnextv2_tiny"
pretrained = true
# Optional: Initialize backbone from your main 48-class model to speed up convergence
# init_from = "runs/convnextv2_tiny_ms1/best.pth"

[train]
# Path to the binary labels CSV generated by make_binary_labels.py
labels_csv = "labels_gate/binary_labels.csv"

epochs = 10
batch_size = 32
learning_rate = 0.0002
weight_decay = 0.01
num_workers = 4
val_frac = 0.2

# Strategy
use_pos_weight = false
balanced_sampler = false
amp = true
grad_clip = 0.0

# Metrics
threshold = 0.5
best_metric = "f1"  # "f1" or "loss"
patience = 0