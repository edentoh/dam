[system]
project_name = "DAM_Classifier"
seed = 42
device = "cuda"
run_name = "convnextv2_tiny_ms1"
runs_dir = "runs"

[model]
pretrained = true
backbone = "convnextv2_tiny"
drop_path_rate = 0.0
grad_checkpointing = false
head_type = "ml_decoder"
ml_decoder_dim = 512
ml_decoder_num_heads = 8
ml_decoder_dropout = 0.1
head_dropout = 0.0
num_classes = 48
use_pose_pretrain = false
pose_pretrain_backbone = "runs/pose_pretrain_convnext_tiny/backbone_pretrain.pth"

# =========================
# TRAINING CONFIG (train.py)
# =========================
[train]
epochs = 100
batch_size = 16
grad_accum_steps = 1
use_amp = true
amp_dtype = "fp16" # "fp16" (uses GradScaler) or "bf16"
learning_rate = 0.00005
weight_decay = 0.3
# Hybrid schedule: freeze pretrained backbone for first N epochs, then unfreeze.
# Set to 0 to disable.
freeze_backbone_epochs = 0

# Weight-decay filtering: no decay for biases and 1D params (LayerNorm/BatchNorm weights).
use_weight_decay_filtering = false

# Discriminative LR (recommended for pretrained backbones):
# backbone_lr = learning_rate * backbone_lr_mult
# head_lr     = learning_rate * head_lr_mult
use_discriminative_lr = false
backbone_lr_mult = 0.1
head_lr_mult = 1.0

# Used ONLY for training-time metrics (NOT for inference/app)
metric_threshold = 0.5

# switch loss: 'bce' or 'asl'
loss = "bce"

lr_milestones = [15, 30, 45, 60, 75, 90]
lr_gamma = 0.5
lr_scheduler = "multistep" # "multistep" or "cosine"
cosine_t_max = 100
cosine_eta_min = 0.000001
use_weighted_loss = true
pos_weight_clamp = 10.0

# Which validation metric decides "best.pth":
# 'val_f1_micro', 'val_f1_macro', 'val_map_micro', 'val_map_macro', or 'val_loss'
metric_for_best = "val_map_macro"

# ASL settings
asl_gamma_neg = 3.0
asl_gamma_pos = 0.0
asl_clip = 0.05

# Rare/zero-positive handling (applies to BOTH BCE and ASL)
# Classes with pos_count < min_pos_for_loss are masked out of loss
use_class_masking = true
min_pos_for_loss = 1
rare_pos_threshold = 10
rare_weight_factor = 0.3

[train.sampler]
# Long-tail handling at sampling time (multi-label aware)
enabled = false
alpha = 0.5
aggregation = "max" # "max" or "mean" over positive class weights per sample
min_weight = 1.0
max_weight = 4.0
normalize = true
num_samples_multiplier = 1.0
replacement = true

[train.data]
# Labels spreadsheet (first 48 rows are criteria; columns like "Image 001" ...)
labels_path = "labels/Score_j.xlsx"

# Folder must contain subfolders: img_root_dir/train and img_root_dir/val
img_root_dir = "img_dataset"

# Model input size used in training transforms
img_size = 420
num_workers = 0

# Preprocess (keep train/predict consistent unless you intentionally change it)
use_crop_to_ink = false
crop_threshold = 245
crop_pad = 12
crop_min_size = 50

[train.cv]
enabled = false
num_runs = 5
seed = 333

# =============================================
# AUXILIARY HEAD (total score)
# =============================================
[aux_head]
enabled = true
type = "total_score"
loss = "mse"
weight = 0.2
use_pcgrad = true
decay_after_unfreeze = true
post_warmup_decay_factor = 0.1
normalize_target = true

# =============================================
# CORRELATION CONFIG (train-only stats)
# =============================================
[correlation]
min_support = 5
min_lift = 2.0
mode = "p_rare_given_common"

# =============================================
# PREDICT CONFIG (predict_cli.py, compute_threshold_vector.py)
# =============================================
[predict]
model_path = "runs/convnextv2_tiny_ms1/best.pth"
input_image_dir = "img_dataset/val"
output_excel = "results/DAM_Predictions_test.xlsx"

# Inference batch size for scripts (not used by the API, which is single-image)
batch_size = 16

# Vector thresholds (preferred). If relative, resolved next to model_path.
threshold_vector_path = "threshold_vector.json"

# Fallback scalar threshold used only if vector is missing/invalid
threshold_scalar_fallback = 0.5

# If true, prediction/app will error if vector JSON is missing/invalid.
require_threshold_vector = true

# Correlation calibration (optional; uses correlation_stats.json saved in run dir)
use_correlation_calibration = true
correlation_stats_path = "correlation_stats.json"
class_stats_path = "class_stats.json"

[predict.threshold_fit]
# Threshold optimizer settings for scripts/compute_threshold_vector.py
num_steps = 1001
max_rounds = 20
min_threshold = 0.0
max_threshold = 0.9
tie_break = "closest_to_0.5" # "closest_to_0.5", "highest", "lowest"
score_tolerance = 0.0
toward_highest = 0.0
enforce_no_perf_drop = true
perf_drop_tolerance = 0.0
safe_search_steps = 201

[predict.data]
# Preprocess for inference (should mirror [train.data] unless you purposely change it)
img_size = 420
num_workers = 0
use_crop_to_ink = true
crop_threshold = 245
crop_pad = 12
crop_min_size = 50

[predict.labels]
# Optional. Used for script-side evaluation / threshold fitting.
labels_path = "labels/Score_j.xlsx"
